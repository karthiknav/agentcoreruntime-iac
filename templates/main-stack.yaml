AWSTemplateFormatVersion: '2010-09-09'
Description: 'KYC Main Stack - DynamoDB cases, SQS queue, Lambda triggered on KYC initiation'

Parameters:
  AgentArn:
    Type: String
    Description: ARN of the Bedrock Agent (passed to Lambda as AGENT_ARN environment variable)

  KycLambdaTimeout:
    Type: Number
    Default: 60
    Description: Lambda timeout in seconds
    MinValue: 10
    MaxValue: 900

Resources:
  # DynamoDB table for KYC cases - CaseId as primary key
  KycCasesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-kyc-cases"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: CaseId
          AttributeType: S
      KeySchema:
        - AttributeName: CaseId
          KeyType: HASH
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-kyc-cases"

  # SQS queue - middleware/FastAPI publishes here when KYC is initiated
  KycInitiatedQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-kyc-initiated"
      VisibilityTimeout: 120
      MessageRetentionPeriod: 345600
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-kyc-initiated"

  # Lambda execution role for KYC processor
  KycLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-kyc-lambda-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  KycLambdaSqsDynamoPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: KycLambdaSqsDynamoPolicy
      Roles:
        - !Ref KycLambdaRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SqsConsume
            Effect: Allow
            Action:
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
              - sqs:ChangeMessageVisibility
            Resource: !GetAtt KycInitiatedQueue.Arn
          - Sid: DynamoDBAccess
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:Query
              - dynamodb:BatchGetItem
            Resource:
              - !GetAtt KycCasesTable.Arn
              - !Sub "${KycCasesTable.Arn}/index/*"

  # Lambda triggered by SQS when KYC is initiated
  KycProcessorFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - KycLambdaSqsDynamoPolicy
    Properties:
      FunctionName: !Sub "${AWS::StackName}-kyc-processor"
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt KycLambdaRole.Arn
      Timeout: !Ref KycLambdaTimeout
      Environment:
        Variables:
          AGENT_ARN: !Ref AgentArn
          KYC_CASES_TABLE: !Ref KycCasesTable
      Code:
        ZipFile: |
          import json
          import os
          import logging
          import boto3

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          dynamodb = boto3.resource('dynamodb')

          def handler(event, context):
              agent_arn = os.environ.get('AGENT_ARN')
              table_name = os.environ.get('KYC_CASES_TABLE')
              logger.info('AGENT_ARN=%s KYC_CASES_TABLE=%s', agent_arn, table_name)
              for record in event.get('Records', []):
                  try:
                      body = json.loads(record.get('body', '{}'))
                      case_id = body.get('caseId')
                      logger.info('Processing KYC for caseId=%s', case_id)
                      # TODO: invoke agent, update DynamoDB case status
                  except Exception as e:
                      logger.exception('Error processing record: %s', e)
                      raise
              return {'statusCode': 200}

  # Event source mapping - Lambda is triggered by SQS messages
  KycProcessorEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt KycInitiatedQueue.Arn
      FunctionName: !Ref KycProcessorFunction
      BatchSize: 10

Outputs:
  KycCasesTableName:
    Description: DynamoDB table name for KYC cases (CaseId primary key)
    Value: !Ref KycCasesTable
    Export:
      Name: !Sub "${AWS::StackName}-KycCasesTableName"

  KycCasesTableArn:
    Description: ARN of the KYC cases DynamoDB table
    Value: !GetAtt KycCasesTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-KycCasesTableArn"

  KycInitiatedQueueUrl:
    Description: SQS queue URL for middleware/FastAPI to publish when KYC is initiated
    Value: !Ref KycInitiatedQueue
    Export:
      Name: !Sub "${AWS::StackName}-KycInitiatedQueueUrl"

  KycInitiatedQueueArn:
    Description: ARN of the KYC initiated SQS queue
    Value: !GetAtt KycInitiatedQueue.Arn
    Export:
      Name: !Sub "${AWS::StackName}-KycInitiatedQueueArn"

  KycProcessorFunctionArn:
    Description: ARN of the KYC processor Lambda (triggered by SQS, has AGENT_ARN env var)
    Value: !GetAtt KycProcessorFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-KycProcessorFunctionArn"
